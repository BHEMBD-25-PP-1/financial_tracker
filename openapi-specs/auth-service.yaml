openapi: 3.0.3
info:
  title: Finance Tracker Auth API
  version: 1.0.0
  description: API для регистрации, авторизации и аутентификации пользователей

servers:
  - url: /api/v1
    description: API версия 1

paths:
  /auth/register:
    post:
      summary: Регистрация нового пользователя
      operationId: register_user
      description: |
        Создание нового пользователя в системе
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пользователь с таким логином уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Авторизация пользователя
      operationId: login_user
      description: |
        Аутентификация пользователя и получение JWT токенов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      summary: Обновление токена доступа
      operationId: refresh_token
      description: |
        Обновление access токена с использованием refresh токена
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Токен успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Неверный или истекший refresh токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/change-password:
    post:
      summary: Смена пароля
      operationId: change_password
      description: |
        Изменение пароля текущего авторизованного пользователя
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Пароль успешно изменен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Пароль успешно изменен
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Получить информацию о текущем пользователе
      operationId: get_current_user
      description: |
        Получение информации о текущем авторизованном пользователе
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен доступа

  schemas:
    RegisterRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Иван"
        last_name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Иванов"
        login:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_]+$'
          example: "ivan_user"
        password:
          type: string
          minLength: 8
          maxLength: 100
          format: password
          example: "securePassword123"
      required:
        - first_name
        - last_name
        - login
        - password

    LoginRequest:
      type: object
      properties:
        login:
          type: string
          example: "ivan_user"
        password:
          type: string
          format: password
          example: "securePassword123"
      required:
        - login
        - password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "bearer"
        user:
          $ref: '#/components/schemas/User'

    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      required:
        - refresh_token

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "bearer"

    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
          example: "oldPassword123"
        new_password:
          type: string
          minLength: 8
          maxLength: 100
          format: password
          example: "newPassword123"
      required:
        - current_password
        - new_password

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        first_name:
          type: string
          example: "Иван"
        last_name:
          type: string
          example: "Иванов"
        login:
          type: string
          example: "ivan_user"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
      required:
        - id
        - first_name
        - last_name
        - login
        - created_at
        - updated_at

    Error:
      type: object
      properties:
        detail:
          type: string
          example: "Описание ошибки"
        error_code:
          type: string
          example: "VALIDATION_ERROR"
      required:
        - detail


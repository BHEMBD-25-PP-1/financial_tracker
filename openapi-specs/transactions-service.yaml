openapi: 3.0.3
info:
  title: Finance Tracker Transactions API
  version: 1.0.0
  description: API для управления транзакциями

servers:
  - url: /api/v1
    description: API версия 1

paths:
  /transactions:
    get:
      summary: Получить список транзакций
      operationId: get_transactions
      description: |
        Получить транзакции с пагинацией и фильтрами
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Номер страницы
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          description: Размер страницы
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          description: Фильтр по категории
          schema:
            type: string
        - name: start_date
          in: query
          description: Дата начала периода (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Дата окончания периода (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: group_id
          in: query
          description: Фильтр по группе
          schema:
            type: integer
        - name: transaction_type
          in: query
          description: Фильтр по типу транзакции
          schema:
            type: string
            enum: [income, expense]
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  total:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Создать новую транзакцию
      operationId: create_transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Транзакция создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /transactions/{transactionId}:
    get:
      summary: Получить транзакцию по ID
      operationId: get_transaction_by_id
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет доступа к транзакции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Транзакция не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Обновить транзакцию
      operationId: update_transaction
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: Транзакция обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет доступа к транзакции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Транзакция не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Удалить транзакцию
      operationId: delete_transaction
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Транзакция удалена
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет доступа к транзакции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Транзакция не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен доступа

  schemas:
  schemas:
    Transaction:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        category:
          type: string
        amount:
          type: number
          format: float
        date:
          type: string
          format: date
        user_id:
          type: integer
        group_id:
          type: integer
          nullable: true
          description: ID группы, если транзакция относится к группе
      required:
        - id
        - name
        - type
        - category
        - amount
        - date
        - user_id
        - created_at
        - updated_at

    CreateTransactionRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        category:
          type: string
        amount:
          type: number
          format: float
        date:
          type: string
          format: date
        group_id:
          type: integer
          nullable: true
          description: ID группы, если транзакция относится к группе
      required:
        - name
        - type
        - category
        - amount
        - date

    UpdateTransactionRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        category:
          type: string
        amount:
          type: number
          format: float
        date:
          type: string
          format: date
        group_id:
          type: integer
          nullable: true
          description: ID группы, если транзакция относится к группе
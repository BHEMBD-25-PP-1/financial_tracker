openapi: 3.0.3
info:
  title: Finance Tracker Groups API
  version: 1.0.0
  description: API для управления группами пользователей и групповыми транзакциями

servers:
  - url: /api/v1
    description: API версия 1

paths:
  /groups:
    get:
      summary: Получить список групп пользователя
      operationId: get_groups
      description: |
        Получить все группы, в которых участвует текущий пользователь
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Номер страницы
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          description: Размер страницы
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Создать новую группу
      operationId: create_group
      description: |
        Создание новой группы пользователей
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Группа успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /groups/{groupId}:
    get:
      summary: Получить группу по ID
      operationId: get_group_by_id
      description: |
        Получение информации о группе по её идентификатору
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет доступа к группе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Обновить группу
      operationId: update_group
      description: |
        Обновление информации о группе (только для владельца)
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Группа успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет прав для обновления группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Удалить группу
      operationId: delete_group
      description: |
        Удаление группы (только для владельца)
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Группа успешно удалена
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет прав для удаления группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /groups/{groupId}/members:
    get:
      summary: Получить список участников группы
      operationId: get_group_members
      description: |
        Получение списка всех участников группы
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupMember'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет доступа к группе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Добавить участника в группу
      operationId: add_group_member
      description: |
        Добавление нового участника в группу (только для владельца)
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Участник успешно добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет прав для добавления участников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа или пользователь не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /groups/{groupId}/members/{userId}:
    delete:
      summary: Удалить участника из группы
      operationId: remove_group_member
      description: |
        Удаление участника из группы (только для владельца или самого участника)
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Участник успешно удален
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет прав для удаления участника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа или участник не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /groups/{groupId}/analytics:
    get:
      summary: Получить аналитику по группе
      operationId: get_group_analytics
      description: |
        Получение аналитики по транзакциям группы
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: start_date
          in: query
          description: Дата начала периода (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Дата окончания периода (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: group_by
          in: query
          description: Группировка данных
          schema:
            type: string
            enum: [category, user, date]
            default: category
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupAnalyticsResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет доступа к группе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен доступа

  schemas:
    Group:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Семья Ивановых"
        owner_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
      required:
        - id
        - name
        - owner_id
        - created_at
        - updated_at

    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Семья Ивановых"
      required:
        - name

    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Семья Ивановых"
      required:
        - name

    GroupListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        total:
          type: integer
          example: 5
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
      required:
        - items
        - total
        - page
        - size

    GroupMember:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        group_id:
          type: integer
          example: 1
        role:
          type: string
          enum: [owner, member]
          example: "member"
        joined_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        user:
          type: object
          properties:
            id:
              type: integer
            first_name:
              type: string
            last_name:
              type: string
            login:
              type: string
      required:
        - id
        - user_id
        - group_id
        - role
        - joined_at

    AddMemberRequest:
      type: object
      properties:
        user_id:
          type: integer
          example: 2
      required:
        - user_id

    GroupAnalyticsResponse:
      type: object
      properties:
        group_id:
          type: integer
          example: 1
        total_income:
          type: number
          format: float
          example: 50000.00
        total_expense:
          type: number
          format: float
          example: 30000.00
        balance:
          type: number
          format: float
          example: 20000.00
        statistics:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
                example: "Еда"
              total_amount:
                type: number
                format: float
                example: 15000.00
              transaction_count:
                type: integer
                example: 45
        period:
          type: object
          properties:
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
      required:
        - group_id
        - total_income
        - total_expense
        - balance
        - statistics

    Error:
      type: object
      properties:
        detail:
          type: string
          example: "Описание ошибки"
        error_code:
          type: string
          example: "VALIDATION_ERROR"
      required:
        - detail

